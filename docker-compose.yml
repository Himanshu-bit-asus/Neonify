services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streamify
      POSTGRES_PASSWORD: streamify
      POSTGRES_DB: streamify
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamify -d streamify"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [minio-data:/data]
    ports: ["9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T20-46-04Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/streamify-media && mc anonymous set download local/streamify-media"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: sh -c "npx prisma db push --schema=/app/prisma/schema.prisma && npm run start"
    environment: &service-env
      DATABASE_URL: postgresql://streamify:streamify@postgres:5432/streamify?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: streamify-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      IMPORTED_AUDIO_BUCKET: ${IMPORTED_AUDIO_BUCKET:-Songs}
      JWT_ACCESS_SECRET: change-this-in-production-to-a-long-random-secret
      CORS_ORIGIN: http://localhost:3000
      ML_SERVICE_URL: http://ml:8000
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: streamify-meilisearch-master-key
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports: ["4000:4000"]

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: npm run worker
    environment:
      <<: *service-env
      GROQ_API_KEY: ""
    depends_on:
      api: { condition: service_started }

  ml:
    build: ./services/ml
    environment:
      DATABASE_URL: postgresql://streamify:streamify@postgres:5432/streamify
      # Read-only role for training queries (same creds here; swap to a read-only PG user in prod)
      READ_ONLY_DATABASE_URL: postgresql://streamify:streamify@postgres:5432/streamify
      REDIS_URL: redis://redis:6379
      MODEL_DIR: /app/model
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-streamify-internal}
    volumes: [ml-model:/app/model]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]

  ml-trainer:
    build: ./services/ml
    command: python cron-trainer.py
    environment:
      ML_SERVICE_URL: http://ml:8000
    depends_on:
      ml: { condition: service_started }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      API_INTERNAL_URL: http://api:4000/api
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    depends_on:
      api: { condition: service_started }
    ports: ["3000:3000"]

  prometheus:
    image: prom/prometheus:v3.0.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: [./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    depends_on: [api]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    volumes: [grafana-data:/var/lib/grafana]
    ports: ["3001:3000"]

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      - MEILI_MASTER_KEY=streamify-meilisearch-master-key
      - MEILI_NO_ANALYTICS=true
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  ml-model:
  grafana-data:
  meilisearch-data:
